<style>
:root{
  --bg:#f4efe4; --bg2:#ece3d2; --ink:#2a2014; --ink-soft:#6b5d49;
  --card:#fffdf8; --line:#e3d8c2;
  --herb:#3c5a3c; --herb-deep:#284028; --herb-soft:#e7eddf;
  --amber:#b9762a; --amber-soft:#f6e8d4;
  --gold:#caa54a;
  --red:#a4402f; --red-soft:#f6ddd6;
  --green:#3c7a4e; --shadow:0 12px 30px -16px rgba(42,32,20,.4);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  font-family:'Plus Jakarta Sans',sans-serif;color:var(--ink);
  background:
    radial-gradient(120% 80% at 100% 0%, rgba(202,165,74,.10), transparent 55%),
    radial-gradient(100% 70% at 0% 100%, rgba(60,90,60,.10), transparent 50%),
    var(--bg);
  background-attachment:fixed;
  padding-bottom:96px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header.app{
  padding:16px;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;gap:12px;
}
header.app > div:first-child{
  display:flex;align-items:center;gap:12px;
}
.mark{
  width:48px;height:48px;border-radius:15px;flex:none;
  background:linear-gradient(150deg,var(--herb),var(--herb-deep));
  color:#f4efe4;display:grid;place-items:center;font-family:'Fraunces';
  font-weight:800;font-size:26px;line-height:1;box-shadow:var(--shadow);
  border:1px solid rgba(255,255,255,.15);
}
header.app .ti-wrap{min-width:0;flex:1}
header.app h1{font-family:'Fraunces';font-weight:600;font-size:20px;margin:0;letter-spacing:-.015em}
header.app p{margin:2px 0 0;font-size:12px;color:var(--ink-soft);font-weight:500;letter-spacing:.01em}
header.app .controls{
  display:flex;align-items:center;gap:8px;width:100%;flex-wrap:wrap;
}
.period{
  flex:1;min-width:160px;
  background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 30px 9px 12px;font-family:inherit;font-size:13px;
  font-weight:700;color:var(--ink);box-shadow:var(--shadow);
  -webkit-appearance:none;appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236b5d49' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;background-position:right 10px center;
}
.btn-logout{
  border:none;background:var(--red);color:#fff;
  border-radius:10px;padding:9px 16px;font-family:inherit;font-weight:600;
  font-size:12.5px;cursor:pointer;transition:.15s;flex:none;white-space:nowrap;box-shadow:var(--shadow);
}
.btn-logout:active{transform:scale(.98);}

h2.sec{font-family:'Fraunces';font-weight:600;font-size:16px;margin:24px 4px 11px;letter-spacing:-.005em;
  display:flex;align-items:center;gap:9px}
h2.sec:before{content:"";width:5px;height:16px;border-radius:3px;background:var(--gold);flex:none;opacity:.85}
.muted{color:var(--ink-soft)}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.hero{
  position:relative;overflow:hidden;color:#f3eede;padding:20px;border-radius:22px;
  background:linear-gradient(155deg,var(--herb),var(--herb-deep));
  border:1px solid rgba(255,255,255,.12);box-shadow:var(--shadow)
}
.hero:before{content:"";position:absolute;inset:0;
  background:radial-gradient(80% 60% at 90% 0%,rgba(202,165,74,.35),transparent 60%);pointer-events:none}
.hero .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;font-weight:600}
.hero .big{font-family:'Fraunces';font-weight:600;font-size:34px;margin:4px 0 2px;letter-spacing:-.02em}
.hero .sub{font-size:12.5px;opacity:.85}
.hero.loss .big{color:#ffd9cf}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{padding:14px}
.stat .k{font-size:11.5px;color:var(--ink-soft);font-weight:600;letter-spacing:.02em}
.stat .v{font-family:'Fraunces';font-weight:600;font-size:19px;margin-top:3px;letter-spacing:-.01em}
.stat .v.r{color:var(--red)} .stat .v.g{color:var(--green)}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--herb-soft);color:var(--herb-deep)}

/* list rows */
.row{display:flex;align-items:center;gap:12px;padding:14px 15px;border-bottom:1px solid var(--line);transition:background .15s}
.row:last-child{border-bottom:none}
.row[onclick]:active{background:var(--bg2)}
.row .ic{width:40px;height:40px;border-radius:12px;flex:none;display:grid;place-items:center;font-size:18px;background:var(--herb-soft)}
.row .ic.amber{background:var(--amber-soft)} .row .ic.red{background:var(--red-soft)}
.row .ti{font-weight:600;font-size:14.5px}
.row .me{font-size:12px;color:var(--ink-soft)}
.row .amt{margin-left:auto;text-align:right;font-weight:700;font-size:14.5px;white-space:nowrap}
.row .amt.in{color:var(--green)} .row .amt.out{color:var(--red)}
.row .amt small{display:block;font-weight:500;color:var(--ink-soft);font-size:11px}
.del{margin-left:6px;border:none;background:none;color:var(--ink-soft);font-size:18px;cursor:pointer;padding:4px;opacity:.5}
.del:active{opacity:1;color:var(--red)}
.empty{padding:34px 16px;text-align:center;color:var(--ink-soft);font-size:13.5px}

/* stock badges */
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px}
.b-ok{background:var(--herb-soft);color:var(--herb-deep)}
.b-low{background:var(--amber-soft);color:var(--amber)}
.b-out{background:var(--red-soft);color:var(--red)}

/* segmented */
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:4px 0 14px}
.seg button{flex:1;border:none;background:none;padding:10px 6px;border-radius:10px;font-family:inherit;font-weight:600;font-size:13px;color:var(--ink-soft);cursor:pointer;transition:.18s}
.seg button.on{background:var(--card);color:var(--herb-deep);box-shadow:0 3px 10px -5px rgba(42,32,20,.45)}

/* bottom nav */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,253,248,.92);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom));
}
nav.tabs .in{max-width:520px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 2px;color:var(--ink-soft);font-family:inherit;font-size:10.5px;font-weight:600;cursor:pointer;border-radius:12px;position:relative}
nav.tabs button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button.on{color:var(--herb)}
nav.tabs button.on svg{stroke:var(--herb)}
.nav-badge{position:absolute;top:2px;right:calc(50% - 18px);background:var(--red);color:#fff;font-size:9px;font-weight:800;
  min-width:16px;height:16px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;
  border:2px solid rgba(255,253,248,.92)}

/* fab */
.fab{position:fixed;right:18px;bottom:calc(80px + env(safe-area-inset-bottom));z-index:35;
  width:58px;height:58px;border-radius:19px;border:1px solid rgba(255,255,255,.2);
  background:linear-gradient(150deg,var(--amber),#9a5f1e);color:#fff;font-size:30px;
  display:grid;place-items:center;box-shadow:0 16px 30px -12px rgba(154,95,30,.7);cursor:pointer}
.fab:active{transform:scale(.94)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(42,32,20,.45);z-index:50;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:60;transform:translateY(100%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:520px;margin:0 auto}
.sheet.on{transform:translateY(0)}
.sheet .pane{background:var(--card);border-radius:24px 24px 0 0;border:1px solid var(--line);
  padding:8px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.handle{width:42px;height:5px;background:var(--line);border-radius:99px;margin:8px auto 12px}
.sheet h3{font-family:'Fraunces';font-weight:600;font-size:20px;margin:2px 0 14px}
label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:12px 0 5px}
input,select,textarea{width:100%;font-family:inherit;font-size:15px;color:var(--ink);
  background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--herb);background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--ink-soft);margin-top:6px;min-height:16px}
.btn{width:100%;margin-top:18px;border:none;border-radius:14px;padding:15px;font-family:inherit;
  font-weight:700;font-size:15px;color:#fff;background:linear-gradient(150deg,var(--herb),var(--herb-deep));cursor:pointer}
.btn:active{transform:scale(.99)}
.tinybtn{background:var(--herb-soft);color:var(--herb-deep);border:none;border-radius:9px;padding:7px 10px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer}

/* search bar */
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap input{padding-left:38px;background:var(--card)}
.search-wrap:before{content:"🔍";position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:14px;pointer-events:none}

/* riwayat produk timeline */
.tl-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tl-item:last-child{border-bottom:none}
.tl-dot{width:8px;height:8px;border-radius:99px;margin-top:5px;flex:none}

.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.note{font-size:12px;color:var(--ink-soft);background:var(--herb-soft);border-radius:12px;padding:10px 12px;margin-top:12px}
</style>

<body>

<header class="app">
  <div style="display:flex;align-items:center;gap:12px">
    <div class="mark">ت</div>
    <div class="ti-wrap">
      <h1 id="appName">Tabib Ahmad</h1>
      <p id="appTagline">Keuangan &amp; Stok Herbal</p>
    </div>
    <button onclick="doLogout()" class="btn-logout">Keluar</button>
  </div>
  <select id="period" class="period" style="width:100%"></select>
</header>

<div id="login" style="display:none">
  <div style="position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px">
    <div style="width:100%;max-width:360px;text-align:center">
      <div style="width:64px;height:64px;border-radius:20px;font-size:34px;margin:0 auto 18px;background:linear-gradient(150deg,var(--herb),var(--herb-deep));display:grid;place-items:center;color:#f4efe4">ت</div>
      <h2 style="font-family:Fraunces;font-weight:600;font-size:26px;margin:0 0 4px">Tabib Ahmad</h2>
      <p style="margin:0 0 22px;color:var(--ink-soft);font-size:13.5px">Keuangan & Stok Herbal</p>
      <div style="background:var(--card);padding:20px;text-align:left;border-radius:18px;border:1px solid var(--line)">
        <div style="display:none" id="auth-form-login">
          <label>Email</label><input id="lg_email" type="email" autocomplete="username" placeholder="email@contoh.com" style="margin-bottom:12px">
          <label>Password</label><input id="lg_pass" type="password" autocomplete="current-password" placeholder="••••••••" style="margin-bottom:14px">
          <button class="btn" onclick="doLogin()">Masuk</button>
          <div style="text-align:center;margin-top:12px;font-size:13px;color:var(--ink-soft)">
            Belum punya akun? <button onclick="toggleAuthForm()" style="border:none;background:none;color:var(--herb);font-weight:600;cursor:pointer;padding:0">Daftar di sini</button>
          </div>
          <div style="color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600;text-align:center" id="lg_err"></div>
        </div>
        <div style="display:none" id="auth-form-signup">
          <label>Email</label><input id="sg_email" type="email" autocomplete="username" placeholder="email@contoh.com" style="margin-bottom:12px">
          <label>Password</label><input id="sg_pass" type="password" autocomplete="new-password" placeholder="minimal 6 karakter" style="margin-bottom:12px">
          <label>Konfirmasi Password</label><input id="sg_pass2" type="password" autocomplete="new-password" placeholder="••••••••" style="margin-bottom:14px">
          <button class="btn" onclick="doSignup()">Daftar</button>
          <div style="text-align:center;margin-top:12px;font-size:13px;color:var(--ink-soft)">
            Sudah punya akun? <button onclick="toggleAuthForm()" style="border:none;background:none;color:var(--herb);font-weight:600;cursor:pointer;padding:0">Login di sini</button>
          </div>
          <div style="color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;font-weight:600;text-align:center" id="sg_err"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<main class="wrap" id="view" style="display:none"></main>

<button class="fab" id="fab" aria-label="Tambah">+</button>

<nav class="tabs"><div class="in" id="nav"></div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="pane"><div class="handle"></div><div id="sheetBody"></div></div></div>

<script>
const RP = n => 'Rp ' + Math.round(n||0).toLocaleString('id-ID');

/* ---------- Supabase ---------- */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
let db = {produk:[],amplop:[],jual:[],ops:[],beli:[],adj:[],memo:[]};
let currentUser = null;

/* ---------- Auth ---------- */
function toggleAuthForm(){
  const lg=document.getElementById('auth-form-login'), sg=document.getElementById('auth-form-signup');
  if(lg.style.display==='none'){lg.style.display='block';sg.style.display='none';}
  else{lg.style.display='none';sg.style.display='block';}
  document.getElementById('lg_err').textContent='';
  document.getElementById('sg_err').textContent='';
}
window.toggleAuthForm=toggleAuthForm;

async function doLogin(){
  const email=document.getElementById('lg_email').value.trim();
  const pass=document.getElementById('lg_pass').value;
  const err=document.getElementById('lg_err');
  if(!email||!pass)return err.textContent='Isi email dan password';
  err.textContent='Memproses...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){err.textContent='Login gagal: '+error.message;return;}
  enterApp();
}
window.doLogin=doLogin;

async function doSignup(){
  const email=document.getElementById('sg_email').value.trim();
  const pass=document.getElementById('sg_pass').value;
  const pass2=document.getElementById('sg_pass2').value;
  const err=document.getElementById('sg_err');
  if(!email||!pass||!pass2)return err.textContent='Isi semua field';
  if(pass.length<6)return err.textContent='Password minimal 6 karakter';
  if(pass!==pass2)return err.textContent='Password tidak cocok';
  err.textContent='Memproses...';
  const {data,error}=await sb.auth.signUp({email,password:pass});
  if(error){err.textContent='Daftar gagal: '+error.message;return;}
  err.textContent='';
  err.style.color='var(--green)';
  err.textContent='✓ Daftar berhasil! Silakan login.';
  setTimeout(()=>toggleAuthForm(),1500);
}
window.doSignup=doSignup;

async function doLogout(){
  if(!confirm('Logout?'))return;
  await sb.auth.signOut();
  currentUser=null;
  db={produk:[],amplop:[],jual:[],ops:[],beli:[],adj:[],memo:[]};
  showLogin();
}
window.doLogout=doLogout;

function showLogin(){
  document.getElementById('login').style.display='block';
  document.getElementById('view').style.display='none';
  document.getElementById('auth-form-login').style.display='block';
  document.getElementById('auth-form-signup').style.display='none';
}

async function enterApp(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  currentUser=session.user;
  document.getElementById('login').style.display='none';
  document.getElementById('view').style.display='block';
  await loadAll();
  period=allMonths()[0];
  render();
}

/* ---------- Settings (localStorage) ---------- */
let settings = JSON.parse(localStorage.getItem('ta_settings')||'{}');
let KATEGORI_PRODUK = settings.kategoriProduk || ['Herbal','Konsumsi','Alat','Lainnya'];
let KATEGORI_OPS = settings.kategoriOps || ['Perlengkapan','Peralatan','Promosi','Operasional','Sosial','Renovasi','Jasa','Lainnya'];
function saveSettings(){localStorage.setItem('ta_settings',JSON.stringify(settings));}

function applySettings(){
  document.getElementById('appName').textContent = settings.namaUsaha || 'Tabib Ahmad';
  document.getElementById('appTagline').textContent = settings.tagline || 'Keuangan & Stok Herbal';
  KATEGORI_PRODUK = settings.kategoriProduk || ['Herbal','Konsumsi','Alat','Lainnya'];
  KATEGORI_OPS = settings.kategoriOps || ['Perlengkapan','Peralatan','Promosi','Operasional','Sosial','Renovasi','Jasa','Lainnya'];
}

async function loadAll(){
  if(!currentUser){showLogin();return;}
  const [pr,am,ju,op,be,ad] = await Promise.all([
    sb.from('produk').select('*').eq('user_id',currentUser.id).order('created_at'),
    sb.from('amplop').select('*').eq('user_id',currentUser.id),
    sb.from('jual').select('*').eq('user_id',currentUser.id),
    sb.from('ops').select('*').eq('user_id',currentUser.id),
    sb.from('beli').select('*').eq('user_id',currentUser.id),
    sb.from('adj').select('*').eq('user_id',currentUser.id),
  ]);
  const err=[pr,am,ju,op,be,ad].find(r=>r.error);
  if(err){alert('Gagal memuat data: '+err.error.message);return;}
  db.produk=(pr.data||[]).map(r=>({id:r.id,nama:r.nama,kategori:r.kategori,satuan:r.satuan,hpp:+r.hpp,hargaJual:+r.harga_jual,stokMin:+r.stok_min,stokAwal:+r.stok_awal,imageUrl:r.image_url,stok:0}));
  db.amplop=(am.data||[]).map(r=>({id:r.id,tgl:r.tgl,sumber:r.sumber,jumlah:+r.jumlah,catatan:r.catatan}));
  db.jual=(ju.data||[]).map(r=>({id:r.id,tgl:r.tgl,produkId:r.produk_id,qty:+r.qty,harga:+r.harga,hppSnapshot:+r.hpp_snapshot,catatan:r.catatan}));
  db.ops=(op.data||[]).map(r=>({id:r.id,tgl:r.tgl,nama:r.nama,jumlah:+r.jumlah,kategori:r.kategori,catatan:r.catatan}));
  db.beli=(be.data||[]).map(r=>({id:r.id,tgl:r.tgl,produkId:r.produk_id,qty:+r.qty,harga:+r.harga,catatan:r.catatan}));
  db.adj=(ad.data||[]).map(r=>({id:r.id,tgl:r.tgl,produkId:r.produk_id,delta:+r.delta,catatan:r.catatan}));
  db.memo = JSON.parse(localStorage.getItem('ta_memo')||'[]');
  rebuild(db);
}

function rebuild(db){
  if(!db.adj)db.adj=[];
  db.produk.forEach(pr=>{
    const masuk=db.beli.filter(b=>b.produkId===pr.id).reduce((s,b)=>s+b.qty,0);
    const keluar=db.jual.filter(j=>j.produkId===pr.id).reduce((s,j)=>s+j.qty,0);
    const koreksi=db.adj.filter(a=>a.produkId===pr.id).reduce((s,a)=>s+a.delta,0);
    pr.stok=(pr.stokAwal||0)+masuk-keluar+koreksi;
  });
}

function nameOf(id){const p=db.produk.find(x=>x.id===id);return p?p.nama:'?';}

/* ---------- period ---------- */
function allMonths(){
  const set=new Set();
  [...db.amplop,...db.jual,...db.ops,...db.beli].forEach(x=>set.add(x.tgl.slice(0,7)));
  if(!set.size)set.add(new Date().toISOString().slice(0,7));
  return [...set].sort().reverse();
}
let period = allMonths()[0];
function inP(d){return d.slice(0,7)===period}
const idMonth = ym=>{const[y,m]=ym.split('-');return ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][+m-1]+' '+y};
const fdate = d=>{const[y,m,dd]=d.split('-');return +dd+' '+['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][+m-1]+' '+y};

/* ---------- totals ---------- */
function totals(){
  const masukAmplop = db.amplop.filter(x=>inP(x.tgl)).reduce((s,x)=>s+x.jumlah,0);
  const masukProduk = db.jual.filter(x=>inP(x.tgl)).reduce((s,x)=>s+x.qty*x.harga,0);
  const hpp = db.jual.filter(x=>inP(x.tgl)).reduce((s,x)=>s+x.qty*(x.hppSnapshot||0),0);
  const opsTotal = db.ops.filter(x=>inP(x.tgl)).reduce((s,x)=>s+x.jumlah,0);
  const beliTotal = db.beli.filter(x=>inP(x.tgl)).reduce((s,x)=>s+x.qty*x.harga,0);
  const pemasukan = masukAmplop+masukProduk;
  const laba = pemasukan - hpp - opsTotal;
  const aset = db.produk.reduce((s,p)=>s+p.stok*p.hpp,0);
  return {masukAmplop,masukProduk,pemasukan,hpp,opsTotal,beliTotal,laba,aset};
}

/* ---------- charts ---------- */
function chartBars(t){
  const margin=t.pemasukan>0?Math.round(t.laba/t.pemasukan*100):0;
  const data=[
    {l:'Pemasukan',v:t.pemasukan,c:'var(--green)',sub:[
      {l:'Amplop',v:t.masukAmplop,c:'var(--green)'},
      {l:'Produk',v:t.masukProduk,c:'#5a9e6a'}
    ]},
    {l:'HPP',v:t.hpp,c:'var(--amber)',sub:[]},
    {l:'Operasional',v:t.opsTotal,c:'var(--red)',sub:[]},
    {l:'Laba',v:Math.max(t.laba,0),c:t.laba<0?'var(--red)':'var(--herb)',sub:[]}
  ];
  const max=Math.max(1,...data.map(d=>d.v));
  const fmt=v=>v>=1000000?'Rp '+(v/1000000).toFixed(1)+'jt':v>=1000?'Rp '+Math.round(v/1000)+'rb':'Rp '+v;
  return `
  <div style="display:flex;align-items:flex-end;gap:10px;height:160px;margin-bottom:14px">
    ${data.map(d=>{
      const h=Math.max(Math.round(d.v/max*120),d.v>0?4:0);
      let bar='';
      if(d.sub.length&&(d.sub[0].v||d.sub[1].v)){
        const tot=d.sub[0].v+d.sub[1].v||1;
        const h0=Math.round(d.sub[0].v/tot*h), h1=h-h0;
        bar=`<div style="width:100%;max-width:52px;height:${h}px;border-radius:9px 9px 4px 4px;overflow:hidden;display:flex;flex-direction:column">
          <div style="flex:${h1};background:#5a9e6a"></div>
          <div style="flex:${h0};background:var(--green)"></div>
        </div>`;
      } else {
        bar=`<div style="width:100%;max-width:52px;height:${Math.max(h,d.v>0?4:0)}px;background:${d.c};border-radius:9px 9px 4px 4px;transition:height .5s"></div>`;
      }
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;justify-content:flex-end">
        <div style="font-size:10px;font-weight:700;color:var(--ink-soft);text-align:center;line-height:1.3">${fmt(d.v)}</div>
        ${bar}
        <div style="font-size:10.5px;font-weight:600;color:var(--ink-soft);text-align:center">${d.l}</div>
      </div>`;
    }).join('')}
  </div>
  <div style="border-top:1px solid var(--line);padding-top:12px;display:flex;gap:16px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:6px;font-size:12px">
      <div style="width:10px;height:10px;border-radius:3px;background:var(--green)"></div>
      <span style="color:var(--ink-soft)">Amplop</span><b>${RP(t.masukAmplop)}</b>
    </div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px">
      <div style="width:10px;height:10px;border-radius:3px;background:#5a9e6a"></div>
      <span style="color:var(--ink-soft)">Produk</span><b>${RP(t.masukProduk)}</b>
    </div>
    <div style="margin-left:auto;font-size:12px;font-weight:700;color:${margin<0?'var(--red)':'var(--herb)'}">
      Margin ${margin}%
    </div>
  </div>`;
}

function chartKategori(){
  const m={};const cnt={};
  const filtered=db.ops.filter(x=>inP(x.tgl));
  filtered.forEach(x=>{m[x.kategori]=(m[x.kategori]||0)+x.jumlah;cnt[x.kategori]=(cnt[x.kategori]||0)+1;});
  const rows=Object.entries(m).sort((a,b)=>b[1]-a[1]);
  if(!rows.length)return `<div class="empty" style="padding:14px">Belum ada pengeluaran operasional.</div>`;
  const tot=rows.reduce((s,r)=>s+r[1],0),max=rows[0][1];
  const cols=['var(--herb)','var(--amber)','var(--red)','var(--gold)','var(--herb-deep)','#7a6a52'];
  return `
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line)">
    <div style="font-size:12px;color:var(--ink-soft);font-weight:600">${filtered.length} transaksi</div>
    <div style="font-family:Fraunces;font-size:18px;font-weight:600;color:var(--red)">${RP(tot)}</div>
  </div>
  ${rows.map(([k,v],i)=>`<div style="margin:${i?14:0}px 0 0">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px">
      <div>
        <span style="font-size:13px;font-weight:700">${k}</span>
        <span style="font-size:11px;color:var(--ink-soft);margin-left:6px">${cnt[k]} transaksi · ${Math.round(v/tot*100)}%</span>
      </div>
      <span style="font-size:13px;font-weight:700">${RP(v)}</span>
    </div>
    <div style="height:8px;background:var(--bg2);border-radius:99px;overflow:hidden">
      <div style="height:100%;width:${Math.round(v/max*100)}%;background:${cols[i%cols.length]};border-radius:99px;transition:width .6s"></div>
    </div>
  </div>`).join('')}`;
}
function chartTren(){
  const months=allMonths().slice(0,6).reverse();
  const vals=months.map(m=>{
    const ma=db.amplop.filter(x=>x.tgl.slice(0,7)===m).reduce((s,x)=>s+x.jumlah,0);
    const mp=db.jual.filter(x=>x.tgl.slice(0,7)===m).reduce((s,x)=>s+x.qty*x.harga,0);
    const hp=db.jual.filter(x=>x.tgl.slice(0,7)===m).reduce((s,x)=>s+x.qty*(x.hppSnapshot||0),0);
    const op=db.ops.filter(x=>x.tgl.slice(0,7)===m).reduce((s,x)=>s+x.jumlah,0);
    return ma+mp-hp-op;
  });
  if(vals.length<1)return `<div class="empty" style="padding:14px">Belum ada data transaksi.</div>`;
  const max=Math.max(...vals,1),min=Math.min(...vals,0),range=max-min||1;
  return `<div style="display:flex;align-items:stretch;gap:10px;height:140px">
    ${vals.map((v,i)=>{const h=Math.round((v-min)/range*100)+12;
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px">
        <div style="font-size:10px;font-weight:700;color:${v<0?'var(--red)':'var(--green)'}">${Math.round(v/1000)}rb</div>
        <div style="width:100%;max-width:38px;height:${h}px;border-radius:8px;background:${v<0?'var(--red)':'linear-gradient(var(--herb),var(--herb-deep))'};transition:height .5s"></div>
        <div style="font-size:10.5px;font-weight:600;color:var(--ink-soft)">${idMonth(months[i]).split(' ')[0]}</div>
      </div>`}).join('')}
  </div>`;
}

function exportData(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='tabib-ahmad-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href);
}
window.exportData=exportData;

function stockAlerts(){
  const rows=db.produk.filter(p=>p.stok<=p.stokMin).sort((a,b)=>a.stok-b.stok);
  if(!rows.length) return `<div class="card"><div class="empty">Semua stok aman 🌿</div></div>`;
  return `<div class="card">${rows.map(p=>{
    const out=p.stok<=0, cls=out?'b-out':'b-low', txt=out?(p.stok<0?'MINUS '+p.stok:'HABIS'):'Menipis';
    return `<div class="row"><div class="ic ${out?'red':'amber'}">📦</div>
      <div><div class="ti">${p.nama}</div><div class="me">min ${p.stokMin} ${p.satuan}</div></div>
      <div class="amt"><span class="badge ${cls}">${txt}</span><small>${p.stok} ${p.satuan}</small></div></div>`;
  }).join('')}</div>`;
}

/* ---------- MASUK ---------- */
let masukTab='amplop';
function vMasuk(){
  return `<h2 class="sec">Pemasukan</h2>
  <div class="seg">
    <button class="${masukTab==='amplop'?'on':''}" onclick="setSub('masukTab','amplop')">💛 Amplop</button>
    <button class="${masukTab==='produk'?'on':''}" onclick="setSub('masukTab','produk')">💚 Produk</button>
  </div>
  <div class="search-wrap"><input placeholder="Cari..." value="${srchMasuk}" oninput="srchMasuk=this.value;renderList('masuk')"></div>
  <div class="card" id="list-masuk">${masukTab==='amplop'?listAmplop():listJual()}</div>`;
}
function listAmplop(){
  let r=db.amplop.filter(x=>inP(x.tgl)).sort((a,b)=>b.tgl.localeCompare(a.tgl));
  if(srchMasuk)r=r.filter(x=>(x.sumber||'').toLowerCase().includes(srchMasuk.toLowerCase())||(x.catatan||'').toLowerCase().includes(srchMasuk.toLowerCase()));
  if(!r.length)return emptyRow();
  return r.map(x=>`<div class="row"><div class="ic">🤲</div>
    <div><div class="ti">${x.sumber||'(tanpa nama)'}</div><div class="me">${fdate(x.tgl)}${x.catatan?' · '+x.catatan:''}</div></div>
    <div class="amt in">${RP(x.jumlah)}</div>${delBtn('amplop',x.id)}</div>`).join('');
}
function listJual(){
  let r=db.jual.filter(x=>inP(x.tgl)).sort((a,b)=>b.tgl.localeCompare(a.tgl));
  if(srchMasuk)r=r.filter(x=>nameOf(x.produkId).toLowerCase().includes(srchMasuk.toLowerCase())||(x.catatan||'').toLowerCase().includes(srchMasuk.toLowerCase()));
  if(!r.length)return emptyRow();
  return r.map(x=>`<div class="row"><div class="ic">🛒</div>
    <div><div class="ti">${nameOf(x.produkId)}</div><div class="me">${fdate(x.tgl)} · ${x.qty} × ${RP(x.harga)}</div></div>
    <div class="amt in">${RP(x.qty*x.harga)}<small>HPP ${RP(x.qty*(x.hppSnapshot||0))}</small></div>${delBtn('jual',x.id)}</div>`).join('');
}

/* ---------- KELUAR ---------- */
let keluarTab='ops';
function vKeluar(){
  return `<h2 class="sec">Pengeluaran</h2>
  <div class="seg">
    <button class="${keluarTab==='ops'?'on':''}" onclick="setSub('keluarTab','ops')">🔴 Operasional</button>
    <button class="${keluarTab==='beli'?'on':''}" onclick="setSub('keluarTab','beli')">🔵 Beli Stok</button>

  <div class="card" id="list-keluar">${keluarTab==='ops'?listOps():listBeli()}</div>`;
}
function listOps(){
  let r=db.ops.filter(x=>inP(x.tgl)).sort((a,b)=>b.tgl.localeCompare(a.tgl));
  if(srchKeluar)r=r.filter(x=>x.nama.toLowerCase().includes(srchKeluar.toLowerCase())||x.kategori.toLowerCase().includes(srchKeluar.toLowerCase()));
  if(!r.length)return emptyRow();
  return r.map(x=>`<div class="row"><div class="ic red">🧾</div>

    <div class="amt out">${RP(x.jumlah)}</div>${delBtn('ops',x.id)}</div>`).join('');

function listBeli(){
  let r=db.beli.filter(x=>inP(x.tgl)).sort((a,b)=>b.tgl.localeCompare(a.tgl));
  if(srchKeluar)r=r.filter(x=>nameOf(x.produkId).toLowerCase().includes(srchKeluar.toLowerCase()));
  if(!r.length)return emptyRow();
  return r.map(x=>`<div class="row"><div class="ic amber">📥</div>
    <div><div class="ti">${nameOf(x.produkId)}</div><div class="me">${fdate(x.tgl)} · ${x.qty} × ${RP(x.harga)}</div></div>
    <div class="amt out">${RP(x.qty*x.harga)}<small>+ stok</small></div>${delBtn('beli',x.id)}</div>`).join('');

/* update list tanpa full render */
function renderList(which){
  if(which==='masuk'){const el=document.getElementById('list-masuk');if(el)el.innerHTML=masukTab==='amplop'?listAmplop():listJual();}
  if(which==='keluar'){const el=document.getElementById('list-keluar');if(el)el.innerHTML=keluarTab==='ops'?listOps():listBeli();}
  if(which==='stok'){const el=document.getElementById('list-stok');if(el)el.innerHTML=listStokItems();}
}
window.renderList=renderList;

/* ---------- STOK ---------- */
function prodRow(p){
  const out=p.stok<=0,low=p.stok>0&&p.stok<=p.stokMin;
  const cls=out?'b-out':low?'b-low':'b-ok', txt=out?(p.stok<0?'minus':'habis'):low?'menipis':'aman';
  const thumb=p.imageUrl?`<img src="${p.imageUrl}" style="width:40px;height:40px;border-radius:12px;object-fit:cover" alt="${p.nama}">`:'📦';
  return `<div class="row" style="cursor:pointer" onclick="openProdukDetail('${p.id}')"><div class="ic">${thumb}</div>
    <div><div class="ti">${p.nama} <span class="muted" style="font-weight:500;font-size:12px">›</span></div><div class="me">Modal ${RP(p.hpp)} · jual ${RP(p.hargaJual)}</div></div>
    <div class="amt">${p.stok} ${p.satuan}<small><span class="badge ${cls}">${txt}</span></small></div></div>`;
}

function listStokItems(){
  let prods=db.produk;
  if(srchStok)prods=prods.filter(p=>p.nama.toLowerCase().includes(srchStok.toLowerCase()));
  if(!prods.length)return `<div class="empty">Tidak ada produk ditemukan.</div>`;
  const groups={};prods.forEach(p=>{(groups[p.kategori||'Lainnya']=groups[p.kategori||'Lainnya']||[]).push(p)});
  const order=[...KATEGORI_PRODUK.filter(k=>groups[k]),...Object.keys(groups).filter(k=>!KATEGORI_PRODUK.includes(k))];
  return order.map(k=>`<div style="margin-bottom:6px">
    <div style="padding:10px 15px 4px;font-size:11px;font-weight:700;color:var(--ink-soft);letter-spacing:.06em;text-transform:uppercase">${k}</div>
    ${groups[k].map(prodRow).join('')}</div>`).join('');
}

function vStok(){
  if(!db.produk.length)return `<h2 class="sec">Stok Barang</h2><div class="card">${emptyRow()}</div>
    <button class="btn" style="background:linear-gradient(150deg,var(--amber),#9a5f1e)" onclick="openForm('produk')">+ Tambah produk</button>`;
  return `<h2 class="sec">Stok Barang</h2>
  <div class="search-wrap"><input placeholder="Cari produk..." value="${srchStok}" oninput="srchStok=this.value;renderList('stok')"></div>
  <div class="card" id="list-stok">${listStokItems()}</div>
  <button class="btn" style="background:linear-gradient(150deg,var(--amber),#9a5f1e);margin-top:14px" onclick="openForm('produk')">+ Tambah produk</button>`;
}

/* ---------- riwayat per produk ---------- */
function openProdukDetail(id){
  const p=db.produk.find(x=>x.id===id);
  if(!p)return;

  const riwayat=[];
  db.beli.filter(x=>x.produkId===id).forEach(x=>riwayat.push({tgl:x.tgl,tipe:'beli',qty:x.qty,harga:x.harga,catatan:x.catatan}));
  db.jual.filter(x=>x.produkId===id).forEach(x=>riwayat.push({tgl:x.tgl,tipe:'jual',qty:x.qty,harga:x.harga,catatan:x.catatan}));
  db.adj.filter(x=>x.produkId===id).forEach(x=>riwayat.push({tgl:x.tgl,tipe:'adj',delta:x.delta,catatan:x.catatan}));
  riwayat.sort((a,b)=>b.tgl.localeCompare(a.tgl));

  const thumb=p.imageUrl?`<img src="${p.imageUrl}" style="width:100%;max-height:180px;object-fit:cover;border-radius:14px;margin-bottom:14px">`:'';
  const out=p.stok<=0,low=p.stok>0&&p.stok<=p.stokMin;
  const cls=out?'b-out':low?'b-low':'b-ok',txt=out?(p.stok<0?'minus':'habis'):low?'menipis':'aman';

  const tlRows=riwayat.length?riwayat.map(r=>{
    const [color,icon,label]=r.tipe==='beli'?['var(--green)','📥','Beli +'+r.qty]:
      r.tipe==='jual'?['var(--red)','🛒','Jual −'+r.qty]:
      [r.delta>0?'var(--green)':'var(--amber)','⚖️','Opname '+(r.delta>0?'+':'')+r.delta];
    const nilai=r.tipe==='adj'?'':(r.qty*(r.harga||0));
    return `<div class="tl-item">
      <div class="tl-dot" style="background:${color}"></div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:600;font-size:13.5px">${icon} ${label} ${p.satuan}</div>
        <div style="font-size:12px;color:var(--ink-soft)">${fdate(r.tgl)}${r.catatan?' · '+r.catatan:''}</div>
      </div>
      ${nilai?`<div style="font-weight:700;font-size:13px;color:${r.tipe==='beli'?'var(--amber)':'var(--green)'}">${RP(nilai)}</div>`:''}
    </div>`;
  }).join(''):`<div class="empty" style="padding:20px">Belum ada riwayat transaksi.</div>`;

  openSheet(`
    ${thumb}
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">
      <div style="flex:1">
        <div style="font-family:Fraunces;font-size:20px;font-weight:600">${p.nama}</div>
        <div style="font-size:12px;color:var(--ink-soft)">${p.kategori} · ${p.satuan}</div>
      </div>
      <div style="text-align:right">
        <div style="font-family:Fraunces;font-size:22px;font-weight:600">${p.stok}</div>
        <span class="badge ${cls}">${txt}</span>
      </div>
    </div>
    <div class="grid2" style="margin-bottom:16px">
      <div class="card stat"><div class="k">Modal/HPP</div><div class="v" style="font-size:16px">${RP(p.hpp)}</div></div>
      <div class="card stat"><div class="k">Harga Jual</div><div class="v" style="font-size:16px">${RP(p.hargaJual)}</div></div>
    </div>

/* ---------- upload gambar ---------- */
async function uploadImage(file,produkId){
  if(!file)return null;
  const allowed=['image/jpeg','image/png'];
  if(!allowed.includes(file.type)){alert('Format hanya jpg/jpeg/png');return null;}
  if(file.size>5*1024*1024){alert('Ukuran max 5MB');return null;}
  const ext=file.name.slice(file.name.lastIndexOf('.'));
  const path=`produk/${produkId}/${Date.now()}${ext}`;
  const {error}=await sb.storage.from('produk-images').upload(path,file,{upsert:true});
  if(error){alert('Upload gagal: '+error.message);return null;}
  const {data:{publicUrl}}=sb.storage.from('produk-images').getPublicUrl(path);
  return publicUrl;
}
function previewImage(fileInputId,previewId){
  const file=document.getElementById(fileInputId).files[0];
  const el=document.getElementById(previewId);
  if(!file){el.innerHTML='';return;}
  const reader=new FileReader();
  reader.onload=e=>{el.innerHTML=`<img src="${e.target.result}" style="max-width:120px;max-height:120px;border-radius:12px;margin-top:10px">`};
  reader.readAsDataURL(file);
}

async function delProduk(id){
  const used=[...db.beli,...db.jual,...(db.adj||[])].some(x=>x.produkId===id);
  if(used)return alert('Produk ini punya transaksi beli/jual/penyesuaian. Hapus dulu transaksinya, atau biarkan untuk menjaga riwayat HPP.');
  if(!confirm('Hapus produk ini?'))return;
  const pr=db.produk.find(p=>p.id===id);
  if(pr?.imageUrl){
    await sb.storage.from('produk-images').remove([pr.imageUrl.split('/produk-images/')[1]]);
  }
  const {error}=await sb.from('produk').delete().eq('id',id);
  if(error)return alert('Gagal menghapus: '+error.message);
  await loadAll();closeSheet();render();
}

function calcTot(){const q=+(document.getElementById('f_qty')?.value||0),h=+(document.getElementById('f_harga')?.value||0);
  const el=document.getElementById('f_hint');if(el)el.textContent=q&&h?('Total: '+RP(q*h)):'';}
window.prefillJual=prefillJual;window.calcTot=calcTot;

async function saveForm(kind){
  const g=id=>document.getElementById(id)?.value;
  let res;
  if(kind==='amplop'){const j=+g('f_jumlah');if(!j)return alert('Isi jumlah');
    res=await sb.from('amplop').insert({user_id:currentUser.id,tgl:g('f_tgl'),sumber:g('f_sumber'),jumlah:j,catatan:g('f_cat')});}
  else if(kind==='ops'){const j=+g('f_jumlah');if(!g('f_nama')||!j)return alert('Isi nama & jumlah');
    res=await sb.from('ops').insert({user_id:currentUser.id,tgl:g('f_tgl'),nama:g('f_nama'),jumlah:j,kategori:g('f_kat'),catatan:g('f_cat')});}
  else if(kind==='jual'){const q=+g('f_qty'),h=+g('f_harga');if(!q||!h)return alert('Isi jumlah & harga');
    const pr=db.produk.find(p=>p.id===g('f_prod'));
    res=await sb.from('jual').insert({user_id:currentUser.id,tgl:g('f_tgl'),produk_id:g('f_prod'),qty:q,harga:h,hpp_snapshot:pr?pr.hpp:0,catatan:g('f_cat')});}
  else if(kind==='beli'){const q=+g('f_qty'),h=+g('f_harga');if(!q||!h)return alert('Isi jumlah & harga');
    res=await sb.from('beli').insert({user_id:currentUser.id,tgl:g('f_tgl'),produk_id:g('f_prod'),qty:q,harga:h,catatan:g('f_cat')});
    if(!res.error)await sb.from('produk').update({hpp:h}).eq('id',g('f_prod'));}
  else if(kind==='produk'){if(!g('f_nama'))return alert('Isi nama produk');
    const eid=g('f_id');
    const imgGaleri=document.getElementById('f_img')?.files[0];
    const imgKamera=document.getElementById('f_img_cam')?.files[0];
    const file=imgKamera||imgGaleri;
    let imageUrl=null;
    if(file)imageUrl=await uploadImage(file,eid||'new');
    const payload={nama:g('f_nama'),kategori:g('f_kat2'),satuan:g('f_sat')||'pcs',hpp:+g('f_hpp')||0,stok_min:+g('f_min')||0,harga_jual:+g('f_jual')||0};
    if(imageUrl)payload.image_url=imageUrl;
    if(eid)res=await sb.from('produk').update(payload).eq('id',eid);
    else{payload.user_id=currentUser.id;payload.stok_awal=+g('f_awal')||0;res=await sb.from('produk').insert(payload);}}
  else if(kind==='opname'){const pr=db.produk.find(p=>p.id===g('f_id'));const fisik=+g('f_fisik');
    const delta=fisik-pr.stok;if(delta===0){closeSheet();return;}
    res=await sb.from('adj').insert({user_id:currentUser.id,tgl:g('f_tgl'),produk_id:pr.id,delta,catatan:g('f_cat')});}
  else if(kind==='memo'){const teks=g('f_teks')?.trim();if(!teks)return alert('Isi catatan');
    db.memo.push({id:Date.now(),tgl:g('f_tgl'),teks});
    localStorage.setItem('ta_memo',JSON.stringify(db.memo));
    closeSheet();render();return;}

  if(res&&res.error)return alert('Gagal menyimpan: '+res.error.message);
  await loadAll();
  const t=document.getElementById('f_tgl')?.value; if(t)period=t.slice(0,7);
  closeSheet();render();
}
window.saveForm=saveForm;

document.getElementById('period').onchange=e=>{period=e.target.value;render();};

/* ---------- PWA Service Worker ---------- */
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- INIT ---------- */
(async function init(){
  if(SUPABASE_URL.includes('__')){document.body.innerHTML='<p style="font-family:sans-serif;padding:30px">⚠️ Konfigurasi Supabase belum diisi (SUPABASE_URL / SUPABASE_ANON).</p>';return;}
  applySettings();
  const {data:{session}}=await sb.auth.getSession();
  if(session){
    currentUser=session.user;
    enterApp();
  } else {
    showLogin();
  }
})();
</script>
